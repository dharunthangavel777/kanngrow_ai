name: kangrow_ai
description: "Kangrow AI - Premium AI Co-Founder Chat Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9
  http: ^1.2.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding_screen/1.svg
    - assets/onboarding_screen/2.svg
    - assets/onboarding_screen/3.svg
    - assets/onboarding_screen/4.svg
    - assets/auth_screen/auth.svg
    - assets/logos/logo.png
    - assets/logos/QA.svg

